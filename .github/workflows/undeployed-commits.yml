name: undeployed-commits

on:
    workflow_dispatch:

jobs:
    undeployed-commits:
        runs-on: ubuntu-latest

        steps:

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Fetch tags
              run: git fetch --tags

            - name: List commits not deployed to prod
              run: |
                  echo "Commits not deployed to prod:"
                  PROD_TAGS=$(git tag -l "prod/*")
                  if [ -z "$PROD_TAGS" ]; then
                    echo "No prod tags found - listing all commits:"
                    git log --oneline
                  else
                    EXCLUDE=$(echo "$PROD_TAGS" | sed 's/^/^/' | tr '\n' ' ')
                    RESULT=$(git log --oneline HEAD $EXCLUDE)
                    if [ -z "$RESULT" ]; then
                      echo "✅ All commits have been deployed to prod"
                    else
                      echo "$RESULT"
                    fi
                  fi
