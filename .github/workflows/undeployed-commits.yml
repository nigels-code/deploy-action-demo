name: undeployed-commits

on:
    workflow_dispatch:

jobs:
    undeployed-commits:
        runs-on: ubuntu-latest

        steps:

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Fetch tags
              run: git fetch --tags

            - name: List commits not deployed to prod
              run: |
                  echo "=== Debug info ==="
                  echo "Current branch: $(git branch --show-current)"
                  echo "All branches:"
                  git branch -a
                  echo "All tags:"
                  git tag -l
                  echo "=== End debug ==="

                  echo "Commits not deployed to prod:"
                  PROD_TAGS=$(git tag -l "prod/*")
                  if [ -z "$PROD_TAGS" ]; then
                    echo "No prod tags found - listing all commits:"
                    git log --oneline
                  else
                    git log --oneline $(echo "$PROD_TAGS" | sed 's/^/^/')
                  fi
